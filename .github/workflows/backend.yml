name: Test and Deploy Backend

on:
  push:
    branches:
      - master
    paths:
      - 'cloud-resume-challenge/backend/**'
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r cloud-resume-challenge/backend/requirements.txt

    - name: Run Unit Tests with Pytest
      run: |
        cd cloud-resume-challenge/backend
        pytest test_lambda.py -v

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Deploy to AWS Lambda
      run: |
        cd cloud-resume-challenge/backend
        zip function.zip lambda_function.py
        aws lambda update-function-code --function-name VisitorCounter --zip-file fileb://function.zip