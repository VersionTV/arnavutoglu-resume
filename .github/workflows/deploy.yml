name: Deploy Frontend to AWS

# Bu otomasyon, 'main' branch'ine her kod pushlandığında çalışacak.
on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. GitHub reposundaki kodları otomasyon sunucusuna çeker
    - name: Checkout Repository
      uses: actions/checkout@v3

    # 2. GitHub Secrets'a eklediğimiz anahtarlarla AWS'ye güvenli giriş yapar
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1  # S3 bucket'ın buradaysa böyle kalabilir

    # 3. Dosyaları S3 bucket'ına yükler (.git klasörü hariç)
    - name: Deploy to S3 bucket
      run: |
        aws s3 sync ./ s3://${{ secrets.S3_BUCKET_NAME }} --exclude ".git/*" --exclude ".github/*" --delete

    # 4. Sitenin güncellenmesi için CloudFront önbelleğini temizler
    - name: Invalidate CloudFront Cache
      run: |
        aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DIST_ID }} --paths "/*"